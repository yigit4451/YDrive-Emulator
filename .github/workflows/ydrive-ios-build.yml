name: YDrive iOS Native Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Prefer Xcode 27/26/18 for iOS 26+ Liquid Glass support
    - name: Select Xcode Version
      run: |
        if [ -d /Applications/Xcode_27.app ]; then
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          echo "Using Xcode 27"
        elif [ -d /Applications/Xcode_27.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "Using Xcode 27.0"
        elif [ -d /Applications/Xcode_18.2.app ]; then
          sudo xcode-select -s /Applications/Xcode_18.2.app/Contents/Developer
          echo "Using Xcode 18.2"
        elif [ -d /Applications/Xcode_17.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_17.0.app/Contents/Developer
          echo "Using Xcode 17.0"
        elif [ -d /Applications/Xcode_16.2.app ]; then
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          echo "Using Xcode 16.2"
        else
          echo "Using default Xcode: $(xcode-select -p)"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen

    - name: Build PicoDrive Core (iOS arm64)
      run: |
        git clone --depth 1 https://github.com/libretro/picodrive.git
        cd picodrive
        git submodule update --init --recursive
        
        echo "Building PicoDrive for iOS arm64 as a static archive..."
        make -f Makefile.libretro platform=ios-arm64 STATIC_LINKING_LINK=1 USE_LIBCHDR=1 TARGET=libpicodrive_libretro_ios.a MINVERSION="-miphoneos-version-min=26.0" -j$(sysctl -n hw.ncpu)
        
        echo "=== Verifying the static archive ==="
        file libpicodrive_libretro_ios.a
        
        echo "=== Verifying Libretro symbols ==="
        nm -g libpicodrive_libretro_ios.a > symbols.txt
        if ! grep -q "retro_init" symbols.txt; then echo "Missing retro_init"; exit 1; fi
        if ! grep -q "retro_load_game" symbols.txt; then echo "Missing retro_load_game"; exit 1; fi
        if ! grep -q "retro_run" symbols.txt; then echo "Missing retro_run"; exit 1; fi
        if ! grep -q "filestream_vfs_init" symbols.txt; then echo "Missing filestream_vfs_init (libretro-common failed)"; exit 1; fi
        if ! grep -q "rpng_alloc" symbols.txt; then echo "Missing rpng_alloc (libretro-common failed)"; exit 1; fi
        echo "Libretro and libretro-common symbols verified."
        
        # Copy the built static library to the Xcode project Sources
        mkdir -p ../YDrive.iOS.Native/Sources/Core
        cp libpicodrive_libretro_ios.a ../YDrive.iOS.Native/Sources/Core/libpicodrive.a
        cd ..

    - name: Generate Xcode Project
      working-directory: YDrive.iOS.Native
      run: |
        xcodegen generate --spec project.yml
        echo "Generated project:"
        head -20 YDrive.xcodeproj/project.pbxproj | grep -E "objectVersion|compatibilityVersion"

    - name: Fix Project Compatibility (objectVersion)
      working-directory: YDrive.iOS.Native
      run: |
        PBXPROJ="YDrive.xcodeproj/project.pbxproj"
        OBJ_VER=$(grep 'objectVersion' "$PBXPROJ" | head -1 | grep -o '[0-9]*')
        echo "Current objectVersion: $OBJ_VER"
        XCODE_MAJOR=$(xcodebuild -version | head -1 | grep -o '[0-9]*' | head -1)
        echo "Active Xcode major: $XCODE_MAJOR"
        if [ "$OBJ_VER" -gt 60 ] && [ "$XCODE_MAJOR" -lt 16 ]; then
          echo "Downgrading objectVersion $OBJ_VER -> 56 for Xcode $XCODE_MAJOR compatibility"
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' "$PBXPROJ"
          echo "Updated objectVersion:"
          grep 'objectVersion' "$PBXPROJ" | head -1
        else
          echo "objectVersion $OBJ_VER is compatible with Xcode $XCODE_MAJOR — no change needed"
        fi

    - name: Build iOS App with Xcode
      working-directory: YDrive.iOS.Native
      run: |
        xcodebuild \
          -project YDrive.xcodeproj \
          -scheme YDrive \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath derived_data \
          SYMROOT="$GITHUB_WORKSPACE/build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Locate Built App
      id: locate_app
      run: |
        APP_PATH=$(find "$GITHUB_WORKSPACE/build" -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: .app bundle not found in build directory!"
          find "$GITHUB_WORKSPACE/build" -type f | head -30
          exit 1
        fi
        echo "Found: $APP_PATH"
        APP_NAME=$(basename "$APP_PATH")
        echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

    # ─── Diagnostics: inspect the raw Xcode-built .app ───────────────────────
    - name: Inspect Xcode-built .app bundle
      run: |
        APP_PATH="${{ steps.locate_app.outputs.app_path }}"
        APP_NAME="${{ steps.locate_app.outputs.app_name }}"
        echo "=== Contents of $APP_NAME ==="
        ls -la "$APP_PATH/"

        echo ""
        echo "=== file (executable arch) ==="
        file "$APP_PATH/YDrive" || true

        echo ""
        echo "=== plutil Info.plist ==="
        plutil -p "$APP_PATH/Info.plist" || true

        echo ""
        echo "=== codesign state (raw from Xcode) ==="
        codesign -dvvv "$APP_PATH" || true

        echo ""
        echo "=== entitlements (raw from Xcode) ==="
        codesign -d --entitlements :- "$APP_PATH" || true

    # ─── A: YDrive-unsigned.ipa ───────────────────────────────────────────────
    # Xcode'un tam .app paketini kullan, _CodeSignature varsa kaldır.
    # Executable, Assets.car, Info.plist veya diğer dosyalara dokunma.
    - name: Package A — YDrive-unsigned.ipa
      run: |
        APP_PATH="${{ steps.locate_app.outputs.app_path }}"
        APP_NAME="${{ steps.locate_app.outputs.app_name }}"

        rm -rf Payload_unsigned
        mkdir -p Payload_unsigned

        # Tam Xcode .app'i kopyala (symlinks korunur)
        cp -R "$APP_PATH" Payload_unsigned/

        # Yalnızca imza metadata'sını kaldır; diğer dosyalara dokunma
        echo "Removing _CodeSignature from unsigned copy..."
        rm -rf "Payload_unsigned/$APP_NAME/_CodeSignature"
        # Embedded provisioning profile yoksa bu zaten boş olacak
        rm -f "Payload_unsigned/$APP_NAME/embedded.mobileprovision"

        # İzinleri ayarla
        chmod -R 755 Payload_unsigned/

        echo "=== Unsigned .app contents ==="
        ls -la "Payload_unsigned/$APP_NAME/"

        # IPA oluştur (symlinks korunur)
        zip -r -y YDrive-unsigned.ipa Payload_unsigned --exclude "*.DS_Store"
        # IPA yapısını Payload/ olarak düzelt
        mv YDrive-unsigned.ipa YDrive-unsigned-raw.ipa
        rm -rf Payload_unsigned_final
        mkdir -p Payload_unsigned_final/Payload
        cp -R "Payload_unsigned/$APP_NAME" Payload_unsigned_final/Payload/
        cd Payload_unsigned_final && zip -r -y ../YDrive-unsigned.ipa Payload --exclude "*.DS_Store"
        cd ..
        rm -rf Payload_unsigned Payload_unsigned_final YDrive-unsigned-raw.ipa

        echo "=== YDrive-unsigned.ipa size ==="
        ls -lh YDrive-unsigned.ipa

    # ─── B: YDrive-adhoc.ipa ─────────────────────────────────────────────────
    # Aynı .app bundle'ı macOS codesign ile ad-hoc imzala.
    # Önce nested binary/framework tespiti, sonra inside-out signing sırası.
    - name: Package B — YDrive-adhoc.ipa
      run: |
        APP_PATH="${{ steps.locate_app.outputs.app_path }}"
        APP_NAME="${{ steps.locate_app.outputs.app_name }}"

        rm -rf Payload_adhoc
        mkdir -p Payload_adhoc

        # Tam Xcode .app'i kopyala
        cp -R "$APP_PATH" Payload_adhoc/

        STAGED_APP="Payload_adhoc/$APP_NAME"

        # Eski signature kalıntılarını temizle (çakışmayı önlemek için)
        echo "Cleaning old signature metadata before re-signing..."
        rm -rf "$STAGED_APP/_CodeSignature"
        rm -f "$STAGED_APP/embedded.mobileprovision"

        # İzinleri ayarla
        chmod -R 755 Payload_adhoc/

        # Nested binary/framework tespiti ve inside-out signing
        echo "=== Detecting nested binaries/frameworks ==="
        find "$STAGED_APP" -type d \( -name "*.framework" -o -name "*.appex" -o -name "*.dylib" \) | sort
        find "$STAGED_APP" -type f -name "*.dylib" | sort

        echo ""
        echo "=== Signing nested components first (inside-out) ==="
        # Frameworks
        find "$STAGED_APP/Frameworks" -maxdepth 1 -type d -name "*.framework" 2>/dev/null | while read fw; do
          echo "Signing framework: $fw"
          codesign --force --sign - "$fw"
        done || true

        # Dylibs
        find "$STAGED_APP" -name "*.dylib" 2>/dev/null | while read dylib; do
          echo "Signing dylib: $dylib"
          codesign --force --sign - "$dylib"
        done || true

        # App extensions
        find "$STAGED_APP/PlugIns" -maxdepth 1 -type d -name "*.appex" 2>/dev/null | while read ext; do
          echo "Signing extension: $ext"
          codesign --force --sign - "$ext"
        done || true

        # Ana .app bundle'ı imzala (en son)
        echo ""
        echo "=== Signing main app bundle ==="
        codesign --force --sign - "$STAGED_APP"

        # Doğrulama ve tanısal çıktılar
        echo ""
        echo "=== POST-SIGN: codesign -dvvv ==="
        codesign -dvvv "$STAGED_APP"

        echo ""
        echo "=== POST-SIGN: entitlements ==="
        codesign -d --entitlements :- "$STAGED_APP"

        echo ""
        echo "=== POST-SIGN: codesign --verify --deep --strict --verbose=4 ==="
        codesign --verify --deep --strict --verbose=4 "$STAGED_APP"

        echo ""
        echo "=== file (executable arch) ==="
        file "$STAGED_APP/YDrive"

        echo ""
        echo "=== plutil Info.plist ==="
        plutil -p "$STAGED_APP/Info.plist"

        # IPA oluştur (Payload/YDrive.app/... yapısı)
        rm -rf Payload_adhoc_final
        mkdir -p Payload_adhoc_final/Payload
        cp -R "$STAGED_APP" Payload_adhoc_final/Payload/
        cd Payload_adhoc_final && zip -r -y ../YDrive-adhoc.ipa Payload --exclude "*.DS_Store"
        cd ..
        rm -rf Payload_adhoc Payload_adhoc_final

        echo "=== YDrive-adhoc.ipa size ==="
        ls -lh YDrive-adhoc.ipa

    # ─── Artifacts ───────────────────────────────────────────────────────────
    - name: Upload YDrive-unsigned.ipa
      uses: actions/upload-artifact@v4
      with:
        name: YDrive-unsigned
        path: YDrive-unsigned.ipa
        retention-days: 14

    - name: Upload YDrive-adhoc.ipa
      uses: actions/upload-artifact@v4
      with:
        name: YDrive-adhoc
        path: YDrive-adhoc.ipa
        retention-days: 14
