name: YDrive iOS Native Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      working-directory: YDrive.iOS.Native
      run: xcodegen generate

    - name: Build (no signing)
      working-directory: YDrive.iOS.Native
      run: |
        xcodebuild \
          -project YDrive.xcodeproj \
          -scheme YDrive \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          -derivedDataPath build

    - name: Create IPA Package
      run: |
        rm -rf Payload YDrive.ipa
        mkdir -p Payload
        APP_PATH=$(find YDrive.iOS.Native/build -name "*.app" -type d | grep -v Simulator | head -n 1)
        cp -R "$APP_PATH" Payload/
        chmod -R 755 Payload/
        zip -r -y YDrive.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YDrive-iOS-IPA
        path: YDrive.ipa
        retention-days: 14
