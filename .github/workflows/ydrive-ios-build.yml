name: YDrive iOS Native Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Prefer Xcode 27/18 for iOS 27 Liquid Glass support
    - name: Select Xcode Version
      run: |
        if [ -d /Applications/Xcode_27.app ]; then
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          echo "Using Xcode 27"
        elif [ -d /Applications/Xcode_27.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "Using Xcode 27.0"
        elif [ -d /Applications/Xcode_18.2.app ]; then
          sudo xcode-select -s /Applications/Xcode_18.2.app/Contents/Developer
          echo "Using Xcode 18.2"
        elif [ -d /Applications/Xcode_17.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_17.0.app/Contents/Developer
          echo "Using Xcode 17.0"
        elif [ -d /Applications/Xcode_16.2.app ]; then
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          echo "Using Xcode 16.2"
        else
          echo "Using default Xcode: $(xcode-select -p)"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen

    - name: Generate Xcode Project
      working-directory: YDrive.iOS.Native
      run: |
        xcodegen generate --spec project.yml
        echo "Generated project:"
        head -20 YDrive.xcodeproj/project.pbxproj | grep -E "objectVersion|compatibilityVersion"

    - name: Fix Project Compatibility (objectVersion)
      working-directory: YDrive.iOS.Native
      run: |
        PBXPROJ="YDrive.xcodeproj/project.pbxproj"
        OBJ_VER=$(grep 'objectVersion' "$PBXPROJ" | head -1 | grep -o '[0-9]*')
        echo "Current objectVersion: $OBJ_VER"
        XCODE_MAJOR=$(xcodebuild -version | head -1 | grep -o '[0-9]*' | head -1)
        echo "Active Xcode major: $XCODE_MAJOR"
        # If project format is newer than what Xcode can handle, downgrade to 56
        if [ "$OBJ_VER" -gt 60 ] && [ "$XCODE_MAJOR" -lt 16 ]; then
          echo "Downgrading objectVersion $OBJ_VER -> 56 for Xcode $XCODE_MAJOR compatibility"
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' "$PBXPROJ"
          echo "Updated objectVersion:"
          grep 'objectVersion' "$PBXPROJ" | head -1
        else
          echo "objectVersion $OBJ_VER is compatible with Xcode $XCODE_MAJOR — no change needed"
        fi

    - name: Build iOS App with Xcode
      working-directory: YDrive.iOS.Native
      run: |
        xcodebuild \
          -project YDrive.xcodeproj \
          -scheme YDrive \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath derived_data \
          SYMROOT="$GITHUB_WORKSPACE/build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Create AltStore-Ready IPA Package
      run: |
        rm -rf Payload YDrive.ipa
        mkdir -p Payload
        APP_PATH=$(find "$GITHUB_WORKSPACE/build" -name "*.app" -type d | head -n 1)
        echo "Bulunan App Yolu: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "HATA: .app paketi build klasöründe bulunamadı!"
          exit 1
        fi

        # Dosyayı Payload içine kopyala
        cp -R "$APP_PATH" Payload/

        # İzinleri düzenle
        chmod -R 755 Payload/

        # Build sonrası mevcut binary'nin imza durumunu raporla (Diagnostic)
        APP_DIR_NAME=$(basename "$APP_PATH")
        echo "--- PRE-SIGN DIAGNOSTICS ---"
        codesign -dvvv Payload/"$APP_DIR_NAME" || true
        codesign -d --entitlements :- Payload/"$APP_DIR_NAME" || true

        # AltStore için tüm application bundle'ı ad-hoc imzala (_CodeSignature oluşturulması için)
        # ldid yerine doğrudan macOS native codesign aracı kullanılıyor
        echo "--- APPLYING AD-HOC SIGNATURE ---"
        codesign --force --deep --sign - Payload/"$APP_DIR_NAME"

        # Final uygulamanın imzasını doğrula (Diagnostic)
        echo "--- POST-SIGN VERIFICATION ---"
        codesign --verify --deep --strict --verbose=4 Payload/"$APP_DIR_NAME"

        # Symlinkleri koruyarak zip'le
        zip -r -y YDrive.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YDrive-iOS-IPA
        path: YDrive.ipa
        retention-days: 14
