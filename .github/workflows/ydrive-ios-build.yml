name: YDrive iOS Native Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Prefer Xcode 16, fall back to 15.4 (both available on macos-14)
    - name: Select Xcode Version
      run: |
        if [ -d /Applications/Xcode_16.0.app ]; then
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          echo "Using Xcode 16.0"
        elif [ -d /Applications/Xcode_15.4.app ]; then
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          echo "Using Xcode 15.4"
        else
          echo "Using default Xcode: $(xcode-select -p)"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen

    - name: Generate Xcode Project
      working-directory: YDrive.iOS.Native
      run: |
        xcodegen generate --spec project.yml
        echo "Generated project:"
        head -20 YDrive.xcodeproj/project.pbxproj | grep -E "objectVersion|compatibilityVersion"

    - name: Build iOS App with Xcode
      working-directory: YDrive.iOS.Native
      run: |
        xcodebuild \
          -project YDrive.xcodeproj \
          -scheme YDrive \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath derived_data \
          SYMROOT="$GITHUB_WORKSPACE/build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Create AltStore-Ready IPA Package
      run: |
        rm -rf Payload YDrive.ipa
        mkdir -p Payload
        APP_PATH=$(find "$GITHUB_WORKSPACE/build" -name "*.app" -type d | head -n 1)
        echo "Bulunan App Yolu: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "HATA: .app paketi build klasöründe bulunamadı!"
          exit 1
        fi

        # Dosyayı Payload içine kopyala
        cp -R "$APP_PATH" Payload/

        # İzinleri düzenle
        chmod -R 755 Payload/

        # AltStore/SideStore için ad-hoc imza (ldid) uygula
        brew install ldid || true
        APP_DIR_NAME=$(basename "$APP_PATH")
        ldid -S Payload/"$APP_DIR_NAME"/YDrive || true

        # Symlinkleri koruyarak zip'le
        zip -r -y YDrive.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YDrive-iOS-IPA
        path: YDrive.ipa
        retention-days: 14
