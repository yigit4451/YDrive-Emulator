name: YDrive
options:
  bundleIdPrefix: com.yigit
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.yigit.ydrive
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "6.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_UPCOMING_FEATURE_CONCURRENCY_WARNINGS: NO

targets:
  YDrive:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/en.lproj
      - Resources/tr.lproj
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.yigit.ydrive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        # ObjC bridging header — exposes LibretroBridge to Swift
        SWIFT_OBJC_BRIDGING_HEADER: Sources/YDrive-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        # When a libretro core .a is linked, set YDRIVE_CORE_AVAILABLE=1 here:
        OTHER_CFLAGS: "-DYDRIVE_CORE_AVAILABLE=1"
        OTHER_LDFLAGS: "-lpicodrive -lz"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Sources/Core"
        KNOWN_REGIONS: "en tr"
        DEVELOPMENT_LANGUAGE: en
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: Photos.framework

